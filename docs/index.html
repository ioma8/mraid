<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MRAID — WYSIWYG Mermaid editor</title>
  <style>
    :root{--ink:#20242d;--muted:#737987;--purple:#7059e8;--line:#e7e8ec}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px Arial,sans-serif;background:#fcfcfd}nav{height:64px;max-width:1060px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px;font-weight:700}.mark{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--purple);color:#fff}.button{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:8px;background:var(--purple);color:#fff;text-decoration:none;font-weight:600;box-shadow:0 5px 18px #7059e833}.hero{max-width:1060px;margin:auto;padding:88px 24px 105px;display:grid;grid-template-columns:.82fr 1.18fr;gap:70px;align-items:center}.eyebrow{color:var(--purple);font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase}.hero h1{font-size:clamp(45px,6vw,70px);line-height:.98;letter-spacing:-5px;margin:18px 0}.hero p{max-width:400px;color:var(--muted);font-size:17px;line-height:1.5;margin:0 0 26px}.diagram{height:330px;border:1px solid var(--line);border-radius:18px;background:#fff;background-image:radial-gradient(#dedfe7 1px,transparent 1px);background-size:20px 20px;box-shadow:0 20px 55px #2423380d}.diagram svg{width:100%;height:100%;display:block}.edge{fill:none;stroke:#a4a8b4;stroke-width:2;marker-end:url(#arrow)}.node rect{fill:#fff;stroke:#c8cad3;stroke-width:1.5}.node text{fill:#20242d;font:600 14px Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.node.decision rect{stroke:#a499ec;stroke-width:2}.node.finish rect{fill:#f5f3ff;stroke:#a499ec}.label{fill:#777d8b;font:12px Arial,sans-serif;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px}.foot{max-width:1060px;margin:auto;padding:22px 24px;border-top:1px solid var(--line);color:#9a9faa;font-size:12px}@media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:58px;gap:44px}.diagram{height:290px}.hero h1{letter-spacing:-3px}}
  </style>
</head>
<body>
  <nav><div class="brand"><span class="mark">✦</span> MRAID</div><a class="button" href="editor.html">Open editor&nbsp; ↗</a></nav>
  <main><section class="hero"><div><div class="eyebrow">WYSIWYG Mermaid editor</div><h1>Build diagrams visually.</h1><p>Create, connect, and edit Mermaid flowcharts directly on a canvas—with live code sync.</p><a class="button" href="editor.html">Try it in your browser&nbsp; →</a></div><div class="diagram" aria-label="Example Mermaid flowchart"><svg viewBox="0 0 620 330" role="img"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a4a8b4"/></marker></defs><path class="edge" d="M145 165H225"/><path class="edge" d="M315 165H385C415 165 410 100 445 100"/><path class="edge" d="M315 165H385C415 165 410 230 445 230"/><text class="label" x="410" y="130">yes</text><text class="label" x="410" y="204">no</text><g class="node"><rect x="35" y="135" width="110" height="60" rx="12"/><text x="90" y="165">Start</text></g><g class="node decision"><rect x="225" y="135" width="90" height="60" rx="12" transform="rotate(45 270 165)"/><text x="270" y="165">Decide</text></g><g class="node"><rect x="445" y="70" width="125" height="60" rx="12"/><text x="507" y="100">Continue</text></g><g class="node finish"><rect x="445" y="200" width="125" height="60" rx="30"/><text x="507" y="230">Finish</text></g></svg></div></section></main>
  <footer class="foot">MRAID · a focused WYSIWYG Mermaid editor.</footer>
</body>
</html>
